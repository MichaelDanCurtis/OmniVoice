[project]
name = "omnivoice-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "huggingface-hub>=0.36.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]
asr = [
  "sherpa-onnx>=1.10.0",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
]
# Optional NVIDIA acceleration. sherpa-onnx runs the *same* model files on the
# CUDA execution provider; this only swaps in the GPU onnxruntime build. The
# version must match the installed CUDA runtime (see README) — when it doesn't,
# the engine logs the failure and falls back to CPU.
gpu = [
  "onnxruntime-gpu>=1.17.1",
]
# Optional multilingual (CJK-focused) ASR via FunASR; heavy Torch dependency.
sensevoice-asr = [
  "funasr>=1.2.6",
  "torch>=2.3.0",
  "torchaudio>=2.3.0",
]
# Optional speaker diarization stack for conversation mode.
whisperx-pyannote = [
  "whisperx>=3.3.0",
  "pyannote.audio>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["omnivoice_engine*"]

[tool.setuptools.package-data]
omnivoice_engine = ["static/*"]
