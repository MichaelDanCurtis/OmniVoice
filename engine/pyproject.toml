[project]
name = "omnivoice-engine"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "huggingface-hub>=0.36.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]
asr = [
  "sherpa-onnx>=1.10.0",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
]
mlx-diarization = [
  "mlx-audio>=0.4.3",
]
mlx-asr = [
  "parakeet-mlx>=0.5.1",
  "mlx-audio>=0.4.3",
]
sensevoice-asr = [
  "funasr>=1.2.6",
  "torch>=2.3.0",
  "torchaudio>=2.3.0",
]
canary-asr = [
  "nemo_toolkit[asr,tts] @ git+https://github.com/NVIDIA/NeMo.git",
]
whisperx-pyannote = [
  "whisperx>=3.3.0",
  "pyannote.audio>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["omnivoice_engine*"]

[tool.setuptools.package-data]
omnivoice_engine = ["static/*"]
