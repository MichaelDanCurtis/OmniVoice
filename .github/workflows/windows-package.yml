name: windows-package

on:
  push:
    branches: [feat/windows-sync-package]
    paths: ["OmniVoice_win/**", ".github/workflows/windows-package.yml"]
  workflow_dispatch: {}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run engine tests
        working-directory: OmniVoice_win/engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Run Core tests
        working-directory: OmniVoice_win
        run: dotnet test tests/OmniVoice.Core.Tests/OmniVoice.Core.Tests.csproj --nologo -v q

      - name: Package single-file OmniSpeak.exe
        working-directory: OmniVoice_win
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Smoke-test the frozen engine
        shell: pwsh
        run: |
          $engine = "OmniVoice_win/engine/dist/omnispeak-engine.exe"
          $env:OMNIVOICE_ENGINE_PORT = "8971"
          $proc = Start-Process -FilePath $engine -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8971/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "frozen engine never became healthy" }
            $providers = Invoke-RestMethod "http://127.0.0.1:8971/providers" -TimeoutSec 5
            if (-not ($providers.id -contains "parakeet-tdt")) { throw "parakeet-tdt missing from /providers" }
            Write-Host "Frozen engine healthy; providers: $($providers.id -join ', ')"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload OmniSpeak.exe
        uses: actions/upload-artifact@v4
        with:
          name: OmniSpeak-win-x64
          path: OmniVoice_win/dist/OmniSpeak.exe
          if-no-files-found: error
